<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LapScope — Cockpit (POC)</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="cockpit-page">
<header>
  <div class="brand"><i></i>LAP<span>SCOPE</span></div>
  <nav>
    <a href="index.html">Live</a>
    <a class="active" href="cockpit.html">Cockpit</a>
    <a href="analysis.html">Analysis</a>
  </nav>
  <div id="car-chip" class="chip" style="display:none"></div>
  <div id="conn" class="chip"><i class="dot"></i><span>connecting…</span></div>
  <button id="settings-btn" class="chip clickable" type="button" title="Settings" aria-label="Settings">⚙ Settings</button>
</header>

<main id="cockpit-stage" role="img" aria-label="Cockpit — loading"></main>

<!-- HTML, not Pixi: hundreds of changing numbers are what the DOM is good at,
     and the cockpit shrinks to make room instead of being covered -->
<section class="panel" id="raw-panel" style="display:none">
  <h2>Raw telemetry — packet values, game-native units
    <button id="raw-hold" type="button" aria-pressed="false" title="Freeze the displayed values to read them — telemetry keeps recording">⏸ Hold</button>
  </h2>
  <div id="raw-body"></div>
</section>

<div id="cockpit-fail" class="overlay hidden">
  <div class="box">
    <h3>The cockpit could not start</h3>
    <p>This browser could not start any of the cockpit's renderers (WebGL,
       WebGPU or the Canvas fallback). The
       <a href="index.html">classic live dashboard</a> may still work.</p>
    <div class="stat error" id="cockpit-fail-why"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/settings.js"></script>
<script src="js/live.js"></script>
<script src="js/live-ui.js"></script>
<script src="js/vendor/pixi.min.js"></script>
<script src="js/cockpit.js"></script>
</body>
</html>
